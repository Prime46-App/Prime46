name: PRIME 46 Production Promotion One-Shot

on:
  push:
    branches:
      - ops/promote-prime46-1678591f

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a1a47cd39ebc17b73c7f299e3390d397
    steps:
      - name: Confirm Cloudflare credential is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not available to this workflow."
            exit 2
          fi

      - name: Promote exact uploaded PRIME 46 version to 100 percent production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.137.0 versions deploy '1678591f-5cb2-40dc-b2eb-7613418da483@100%' --name prime46 -y

      - name: Verify production deployment status
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.137.0 deployments status --name prime46 --json
