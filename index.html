<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#090a0c" />
  <title>PRIME 46 — THE VESSEL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="PRIME 46 Home">
      <span class="brand-mark">46</span>
      <span><strong>PRIME</strong><small>THE GAME OF BECOMING MORE</small></span>
    </button>
    <div class="top-actions">
      <span id="saveState" class="save-state">LOCAL SAVE</span>
      <button class="ghost-btn" id="resetBtn">RESET</button>
    </div>
  </header>

  <main id="app"></main>

  <template id="homeTemplate">
    <section class="hero shell">
      <div class="hero-copy">
        <p class="eyebrow">BODY · THE VESSEL</p>
        <h1>KNOW WHERE YOU STAND.<br><em>THEN BECOME MORE.</em></h1>
        <p class="hero-sub">Establish your physical baseline. PRIME turns real performance into capability, exposes the limiter, and gives your next self something to defeat.</p>
        <div class="hero-actions">
          <button class="primary-btn" data-nav="assessment">BEGIN ASSESSMENT</button>
          <button class="secondary-btn" data-nav="sheet">VIEW CHARACTER SHEET</button>
        </div>
        <div class="principles">
          <span>MASTER THE BASICS</span><span>CAPABILITY OVER APPEARANCE</span><span>THE BOSS = YOU, LAST TIME</span>
        </div>
      </div>
      <div class="hero-card">
        <div class="crest"><span>BODY</span><b>THE<br>VESSEL</b><i>Ⅰ</i></div>
        <div class="hero-stat"><span>VESSEL STATUS</span><strong id="homeVesselStatus">UNRANKED</strong></div>
        <div class="progress-track"><i id="homeProgress"></i></div>
        <small id="homeProgressText">0 / 7 assessments complete</small>
      </div>
    </section>
  </template>

  <template id="assessmentTemplate">
    <section class="shell assessment-layout">
      <aside class="assessment-rail">
        <p class="eyebrow">INITIAL ASSESSMENT</p>
        <h2>BUILD THE BASELINE</h2>
        <nav id="stepNav" class="step-nav"></nav>
        <div class="rail-note"><b>RULE</b><p>Enter standardized performance only. PRIME preserves the raw number and calculates capability from the locked VESSEL v1.0 engine.</p></div>
      </aside>
      <section class="assessment-panel">
        <div id="assessmentContent"></div>
      </section>
    </section>
  </template>

  <template id="sheetTemplate">
    <section class="shell sheet-wrap">
      <div class="sheet-header">
        <div>
          <p class="eyebrow">PLAYER ONE · BODY</p>
          <h1 id="playerName">PLAYER ONE</h1>
          <p id="playerMeta" class="muted"></p>
        </div>
        <button class="secondary-btn" data-nav="assessment">UPDATE ASSESSMENT</button>
      </div>

      <section class="vessel-banner">
        <div class="vessel-title"><span>BODY</span><strong>THE VESSEL</strong></div>
        <div class="vessel-score"><span>VESSEL SCORE</span><b id="vesselScore">—</b><strong id="vesselTier">UNRANKED</strong></div>
        <div class="vessel-gate" id="vesselGate"></div>
      </section>

      <div class="domain-grid" id="domainGrid"></div>

      <div class="insight-grid">
        <section class="panel"><div class="panel-title">STRENGTHS</div><div id="strengths"></div></section>
        <section class="panel"><div class="panel-title">WEAKNESSES</div><div id="weaknesses"></div></section>
        <section class="panel"><div class="panel-title">OPPORTUNITIES</div><div id="opportunities"></div></section>
      </div>

      <section class="panel records-panel">
        <div class="panel-title">RAW PERFORMANCE · THE NUMBERS STAY VISIBLE</div>
        <div id="records"></div>
      </section>
    </section>
  </template>

  <script type="module" src="app.mjs"></script>
</body>
</html>
